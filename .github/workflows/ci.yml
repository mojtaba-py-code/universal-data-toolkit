name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

env:
  PYTHONUNBUFFERED: "1"

# The pipeline only reads the checkout; no job needs a write token.
permissions:
  contents: read

jobs:
  lint:
    name: Lint and type check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Ruff
        run: ruff check src tests scripts examples benchmarks
      - name: mypy
        run: mypy

  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    services:
      # The rest of the suite covers the database layer through SQLite; this
      # service is what exercises a second dialect for real.
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: datatoolkit
          POSTGRES_USER: datatoolkit
          POSTGRES_PASSWORD: ci-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U datatoolkit -d datatoolkit"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      UD_TEST_POSTGRES: "1"
      PGHOST: localhost
      PGPORT: "5432"
      PGDATABASE: datatoolkit
      PGUSER: datatoolkit
      PG_PASSWORD: ci-password
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,postgres]"
      - name: Unit and integration tests
        run: pytest -q --cov=universal_data --cov-report=xml --cov-report=term-missing
      - name: Enforce the coverage floor
        run: coverage report --fail-under=90
      - name: Upload coverage
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage
          path: coverage.xml

  security:
    name: Security checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          # The runner ships its own setuptools, which has had CVEs of its own;
          # pip-audit sees the whole environment, so bring it current first.
          python -m pip install --upgrade pip setuptools
          pip install -e ".[dev]" pip-audit
      - name: Bandit
        run: bandit -r src -c pyproject.toml
      # Blocking: a known CVE anywhere in the resolved tree fails the build.
      # (The editable install of this project is skipped; it is not on PyPI.)
      - name: Dependency audit
        run: pip-audit --skip-editable --progress-spinner off
      - name: Fail if a .env file was committed
        run: |
          if git ls-files --error-unmatch .env >/dev/null 2>&1; then
            echo "A .env file is tracked by git - remove it and rotate the secrets."
            exit 1
          fi

  demo:
    name: End-to-end demo
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .
      - name: Regenerate the sample data
        run: python scripts/generate_sample_data.py
      - name: Run the configuration-driven pipelines
        run: |
          data-tool run configs/customer_pipeline.yaml
          data-tool run configs/orders_etl.yaml
      - name: Run the demonstration script
        run: python examples/08_end_to_end_demo.py
      - name: Upload the generated reports
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: reports
          path: output/*.html

  build:
    name: Build the wheel
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Build
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
          twine check dist/*
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/*

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build the image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: false
          load: true
          tags: universal-data-toolkit:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test the image
        run: |
          docker run --rm universal-data-toolkit:ci version
          docker run --rm -v "$PWD:/data" universal-data-toolkit:ci \
            inspect /data/sample_data/customers_raw.csv --json > /dev/null
