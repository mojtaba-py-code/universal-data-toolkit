[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "universal-data-toolkit"
version = "1.0.0"
description = "Universal data processing toolkit: ingest, validate, clean, transform and export tabular data."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Mojtaba Karimi" }]
keywords = ["etl", "data-quality", "pandas", "data-processing", "pipeline", "cli"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Database",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]

dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "pyarrow>=15.0",
    "openpyxl>=3.1",
    "PyYAML>=6.0",
    "SQLAlchemy>=2.0",
    "requests>=2.31",
    "typer>=0.12",
    "rich>=13.0",
    "psutil>=5.9",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.1"]
mysql = ["PyMySQL>=1.1"]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "bandit>=1.7",
    "types-PyYAML>=6.0",
    "types-requests>=2.31",
]

[project.urls]
Homepage = "https://github.com/mojtaba-py-code/universal-data-toolkit"
Issues = "https://github.com/mojtaba-py-code/universal-data-toolkit/issues"

[project.scripts]
data-tool = "universal_data.cli.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
universal_data = ["py.typed", "quality/templates/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "slow: benchmarks and large-dataset tests",
    "integration: tests that touch a database or the network layer",
]
filterwarnings = ["error::FutureWarning"]

[tool.coverage.run]
source = ["universal_data"]
branch = true
omit = ["*/cli/__main__.py"]

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "@abstractmethod",
]

[tool.ruff]
line-length = 110
target-version = "py312"
src = ["src", "tests"]
# The checked paths are listed explicitly, so ignore-file discovery (which
# depends on where the repository happens to be checked out) is switched off.
respect-gitignore = false
extend-exclude = ["output", "benchmark_output", "build", "dist", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM", "RET", "PTH", "S", "TID"]
ignore = [
    "S101",   # asserts are fine in tests
    "B008",   # typer uses calls in argument defaults
    "B027",   # optional hooks on an ABC are intentional (AuthStrategy.refresh)
    "SIM108", # ternaries are not always more readable
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S", "E501"]
"benchmarks/*" = ["S", "T201"]
"examples/*" = ["T201", "S"]

[tool.ruff.lint.isort]
known-first-party = ["universal_data"]

[tool.mypy]
python_version = "3.12"
files = ["src/universal_data"]
strict = false
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
no_implicit_optional = true
show_error_codes = true

[[tool.mypy.overrides]]
module = ["pandas.*", "numpy.*", "pyarrow.*", "yaml.*", "psutil.*"]
ignore_missing_imports = true

[tool.bandit]
exclude_dirs = ["tests", "benchmarks", ".venv"]
# B101: asserts are used only to narrow types after an explicit validation step,
# never to enforce a security property.
skips = ["B101"]
